apiVersion: kapro.io/v1alpha1
kind: MemberCluster
metadata:
  name: canary-eu
  labels:
    kapro.io/tier: canary
    kapro.io/region: europe-west3
spec:
  delivery:
    mode: pull
    backendRef: argo
    parameters:
      namespace: argocd
      applicationSelector.pos-server: service=pos-server,kapro.io/tier=canary
      applicationSelector.sdc: service=sdc,kapro.io/tier=canary
      applicationSelector.keycloak: service=keycloak,kapro.io/tier=canary
